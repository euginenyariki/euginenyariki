name: Profile checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: profile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate profile README
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check README
        run: |
          test -s README.md
          grep -qi 'Eugine' README.md
          echo "Profile README looks valid."
